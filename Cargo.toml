[package]
name = "clorinde"
version = "1.4.1"
edition = "2021"
license = "MIT/Apache-2.0"
description = "Generate type-checked Rust from your PostgreSQL queries."
homepage = "https://github.com/halcyonnouveau/clorinde"
repository = "https://github.com/halcyonnouveau/clorinde"
readme = "README.md"
categories = ["database"]
keywords = ["postgresql", "query", "generator", "sql", "tokio-postgres"]
include = ["src/**/*", "Cargo.toml", "README.md", "LICENSE-*"]
publish = true

[dependencies]
# Codegen tools
quote = "1.0"
prettyplease = "0.2"
syn = { version = "2.0", features = ["full"] }
proc-macro2 = "1.0"

# Postgres interaction
tokio-postgres = "0.7"
postgres-types = "0.2"

# Async
tokio = { version = "1.50", features = ["rt-multi-thread"] }
futures = "0.3"

# Error handling and reporting
thiserror = "2.0"
miette = { version = "7.6", features = ["fancy"] }

# Parser
chumsky = "0.12"

# CLI handling
clap = { version = "4.6", features = ["derive", "env"] }

# Word case
heck = "0.5"

# Order-preserving map to work around borrowing issues
indexmap = "2.13"

# Generate temporary files
tempfile = "3.27"

# Random generation
rand = "0.10"

# Config handling
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
cargo_toml = "0.22"

# TLS (default-on; disable with `--no-default-features` if you only ever
# point clorinde at a plain-text local Postgres and want a smaller dep tree)
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
tokio-postgres-rustls = { version = "0.13", optional = true }
rustls-native-certs = { version = "0.8", optional = true }
rustls-pemfile = { version = "2", optional = true }

[features]
default = ["tls"]
# Enables rustls so `clorinde live`/`fresh` can talk to managed Postgres
# services that require TLS (Cloud SQL, Neon, Supabase, Aiven, AWS RDS, …).
# Activated by `sslmode=require|verify-ca|verify-full` in the connection URL.
#
# Trust store mirrors libpq's behaviour:
#   * OS native store (Keychain / ca-certificates / Schannel) — covers all
#     publicly-rooted providers (Let's Encrypt, DigiCert, Amazon Trust
#     Services, Google Trust Services, …) on a typical machine.
#   * Optional `PGSSLROOTCERT` PEM bundle — for providers with private
#     roots (notably AWS RDS / Aurora, which uses an internal `Amazon RDS
#     Root CA …` hierarchy not present in any public store).
tls = [
    "dep:rustls",
    "dep:tokio-postgres-rustls",
    "dep:rustls-native-certs",
    "dep:rustls-pemfile",
]

[dev-dependencies]
# Benchmarking
criterion = { version = "0.8", features = ["html_reports"] }
postgres = "0.19"
diesel = { version = "2.3", features = ["postgres"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
tempfile = "3.27"
generated = { path = "benches/generated" }

[[bench]]
name = "execution"
harness = false
path = "benches/execution/main.rs"

[[bench]]
name = "codegen"
harness = false
path = "benches/codegen.rs"

[workspace]
resolver = "2"
members = ["examples/*", "tests/*"]
exclude = ["examples/basic_async_wasm"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = "symbols"
panic = "abort"
